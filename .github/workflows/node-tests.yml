name: Web app and x402 tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check api/server.mjs
          node --check api/x402.mjs
          node --check src/app.js
          node --check src/x402-client.mjs
          node --check src/theme.mjs
      - name: Run tests
        run: npm test
